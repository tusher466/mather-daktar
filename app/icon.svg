<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- High-visibility rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#primaryGreen)" stroke="#34D399" stroke-width="2"/>

  <!-- Crisp White Medical Cross (Doctor) -->
  <rect x="27" y="16" width="10" height="32" rx="3" fill="#FFFFFF"/>
  <rect x="16" y="27" width="32" height="10" rx="3" fill="#FFFFFF"/>

  <!-- Golden Health Sparkle / Leaf Seed at top right -->
  <circle cx="48" cy="16" r="4" fill="#FBBF24" />
</svg>
