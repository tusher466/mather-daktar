<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with subtle border -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2.5" />

  <!-- Center Golden Stethoscope / Health Cross Badge -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Vibrant Medical Plant Leaf -->
  <g filter="url(#glow)">
    <!-- Primary Green Leaf -->
    <path d="M 50,15 C 72,25 82,50 65,75 C 55,85 50,88 50,88 C 50,88 45,85 35,75 C 18,50 28,25 50,15 Z" fill="url(#leafGrad)" />
    
    <!-- Leaf Center Vein -->
    <path d="M 50,22 L 50,82" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 50,40 Q 60,35 65,33" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 50,52 Q 62,47 67,46" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 50,64 Q 58,60 62,60" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 50,45 Q 40,40 35,38" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 50,57 Q 38,52 33,51" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- White Medical Plus Cross in Center -->
    <circle cx="50" cy="52" r="14" fill="#FFFFFF" />
    <rect x="47.5" y="44" width="5" height="16" rx="2" fill="#047857" />
    <rect x="42" y="49.5" width="16" height="5" rx="2" fill="#047857" />
  </g>
</svg>
